<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="t d">
  <title id="t">Week 1: Meeting Mary Business Analyst from the BMAD Method</title>
  <desc id="d">A running course whose km markers are sticky notes for each brainstorming technique. Mary the AI business analyst asks why five times; the Vibe CEO runs toward the MVP finish. Most running apps cheer you on. This one gets you to the finish line, injury-free. These are 4 of the 108 brainstorming techniques in the BMAD Method. 77 ideas: 50 from the Vibe CEO, 27 from Mary.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .navy { fill: #1D2B53; }
      .b { font-weight: 800; }
    </style>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <rect width="12" height="12" fill="#1D2B53"/>
      <rect x="12" y="12" width="12" height="12" fill="#1D2B53"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="1200" fill="#FBF4E9"/>
  <circle cx="1080" cy="150" r="220" fill="#FFE7C2"/>
  <circle cx="1130" cy="110" r="70" fill="#FFD65C" opacity="0.55"/>

  <!-- header -->
  <text x="60" y="84" font-size="24" class="b" fill="#E8553A" letter-spacing="3">A VIBE CEO OFFICE STORY</text>
  <text x="60" y="170" font-size="76" class="b navy">Week 1: Meeting Mary</text>
  <text x="60" y="228" font-size="40" font-weight="600" fill="#137F73">Business Analyst from the BMAD Method</text>

  <!-- road -->
  <path d="M 30 762 C 160 762 200 720 300 720 S 440 690 530 690 S 680 640 760 640 S 900 590 990 590 S 1100 572 1190 566"
