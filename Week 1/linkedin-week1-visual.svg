  <g>
    <rect x="44" y="532" width="150" height="38" rx="19" fill="#E8553A"/>
    <text x="119" y="559" font-size="22" class="b" fill="#FFFFFF" text-anchor="middle">VIBE CEO</text>
    <path d="M 98 600 Q 70 604 66 626" fill="none" stroke="#3B2A2A" stroke-width="12" stroke-linecap="round"/>
    <circle cx="116" cy="606" r="24" fill="#F2C29B"/>
    <path d="M 92 602 Q 114 572 140 600 Z" fill="#3B2A2A"/>
    <path d="M 116 638 L 106 694" stroke="#E8553A" stroke-width="34" stroke-linecap="round"/>
    <rect x="98" y="652" width="24" height="20" rx="3" fill="#FFFFFF" transform="rotate(10 110 662)"/>
    <path d="M 120 646 L 146 666 L 166 648" fill="none" stroke="#F2C29B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 108 648 L 84 672 L 64 664" fill="none" stroke="#F2C29B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 108 700 L 146 722 L 152 752" fill="none" stroke="#1D2B53" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 102 700 L 80 734 L 52 738" fill="none" stroke="#1D2B53" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- km marker sticky notes -->
  <g>
    <rect x="295" y="660" width="10" height="56" fill="#1D2B53"/>
    <g transform="rotate(-3 300 585)">
      <rect x="195" y="510" width="210" height="150" rx="6" fill="#FFD65C"/>
      <text x="300" y="548" font-size="22" class="b" fill="#7A5A00" text-anchor="middle">KM 1</text>
      <text x="300" y="590" font-size="31" class="b navy" text-anchor="middle">Role</text>
      <text x="300" y="628" font-size="31" class="b navy" text-anchor="middle">Playing</text>
    </g>

    <rect x="525" y="630" width="10" height="56" fill="#1D2B53"/>
    <g transform="rotate(2 530 555)">
      <rect x="425" y="480" width="210" height="150" rx="6" fill="#FF9EB5"/>
      <text x="530" y="518" font-size="22" class="b" fill="#8A2340" text-anchor="middle">KM 2</text>
      <text x="530" y="560" font-size="31" class="b navy" text-anchor="middle">Five</text>
      <text x="530" y="598" font-size="31" class="b navy" text-anchor="middle">Whys</text>
    </g>

    <rect x="755" y="580" width="10" height="56" fill="#1D2B53"/>
    <g transform="rotate(-2 760 505)">
      <rect x="655" y="430" width="210" height="150" rx="6" fill="#9EE6C9"/>
      <text x="760" y="468" font-size="22" class="b" fill="#0E5E54" text-anchor="middle">KM 3</text>
      <text x="760" y="510" font-size="31" class="b navy" text-anchor="middle">Cross-</text>
      <text x="760" y="548" font-size="31" class="b navy" text-anchor="middle">Pollination</text>
    </g>

    <rect x="985" y="530" width="10" height="56" fill="#1D2B53"/>
    <g transform="rotate(3 990 455)">
      <rect x="885" y="380" width="210" height="150" rx="6" fill="#B9C6FF"/>
      <text x="990" y="418" font-size="22" class="b" fill="#2A3A8C" text-anchor="middle">KM 4</text>
      <text x="990" y="460" font-size="31" class="b navy" text-anchor="middle">Six Thinking</text>
      <text x="990" y="498" font-size="31" class="b navy" text-anchor="middle">Hats</text>
    </g>

    <!-- finish note -->
    <g transform="rotate(-4 1040 320)">
      <rect x="940" y="262" width="200" height="104" rx="6" fill="#E8553A"/>
      <text x="1040" y="298" font-size="22" class="b" fill="#FFE7C2" text-anchor="middle">FINISH</text>
      <text x="1040" y="342" font-size="31" class="b" fill="#FFFFFF" text-anchor="middle">MVP scope</text>
    </g>
  </g>

  <!-- quote card -->
  <rect x="60" y="812" width="1080" height="176" rx="28" fill="#1D2B53"/>
  <text x="600" y="882" font-size="46" class="b" fill="#FBF4E9" text-anchor="middle">Most running apps cheer you on.</text>
  <text x="600" y="946" font-size="40" class="b" fill="#FFD65C" text-anchor="middle">This one gets you to the finish line, injury-free.</text>
  <text x="1140" y="700" font-size="26" font-weight="600" fill="#44506E" text-anchor="end">Just 4 of the 108 brainstorming</text>
  <text x="1140" y="736" font-size="26" font-weight="600" fill="#44506E" text-anchor="end">techniques in the BMAD Method</text>

  <!-- stat -->
  <text x="60" y="1046" font-size="32" class="b navy">77 ideas in one session</text>
  <text x="1140" y="1046" font-size="24" fill="#44506E" text-anchor="end">by who suggested them</text>
  <rect x="60" y="1066" width="1080" height="64" rx="32" fill="#1A9E8F"/>
  <path d="M 92 1066 H 761 V 1130 H 92 A 32 32 0 0 1 92 1066 Z" fill="#E8553A"/>
  <text x="90" y="1108" font-size="28" class="b" fill="#FFFFFF">50 · Vibe CEO</text>
  <text x="1110" y="1108" font-size="28" class="b" fill="#FFFFFF" text-anchor="end">27 · Mary</text>

  <text x="600" y="1176" font-size="25" font-weight="600" fill="#1D2B53" text-anchor="middle">Agents propose. The human decides.  ·  $0 build  ·  Every decision logged</text>
</svg>
