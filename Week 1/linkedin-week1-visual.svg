  <path d="M 30 762 C 160 762 200 720 300 720 S 440 690 530 690 S 680 640 760 640 S 900 590 990 590 S 1100 572 1190 566"
        fill="none" stroke="#FBF4E9" stroke-width="5" stroke-dasharray="22 18"/>
  <!-- finish line -->
  <rect x="1104" y="536" width="24" height="72" fill="url(#checker)" transform="rotate(-3 1116 572)"/>

  <!-- Mary -->
  <g>
    <circle cx="140" cy="314" r="42" fill="#3B2A2A"/>
    <rect x="98" y="314" width="84" height="44" rx="14" fill="#3B2A2A"/>
    <circle cx="140" cy="324" r="30" fill="#F2C29B"/>
    <path d="M 112 312 Q 140 286 170 312 Z" fill="#3B2A2A"/>
    <circle cx="130" cy="326" r="3.5" fill="#1D2B53"/>
    <circle cx="151" cy="326" r="3.5" fill="#1D2B53"/>
    <path d="M 131 340 Q 140 347 150 340" fill="none" stroke="#1D2B53" stroke-width="3" stroke-linecap="round"/>
    <rect x="102" y="362" width="76" height="86" rx="28" fill="#1A9E8F"/>
    <path d="M 172 384 L 214 344" stroke="#1A9E8F" stroke-width="16" stroke-linecap="round"/>
    <rect x="208" y="322" width="12" height="28" rx="4" fill="#E8553A" transform="rotate(40 214 336)"/>
    <path d="M 108 386 L 92 430" stroke="#1A9E8F" stroke-width="16" stroke-linecap="round"/>
    <rect x="114" y="440" width="18" height="34" rx="6" fill="#1D2B53"/>
    <rect x="148" y="440" width="18" height="34" rx="6" fill="#1D2B53"/>
    <rect x="186" y="436" width="140" height="38" rx="19" fill="#1A9E8F"/>
    <text x="256" y="463" font-size="22" class="b" fill="#FFFFFF" text-anchor="middle">MARY · BA</text>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M 214 300 L 250 318 L 250 290 Z" fill="#FFFFFF" stroke="#1D2B53" stroke-width="4" stroke-linejoin="round"/>
    <rect x="248" y="268" width="480" height="128" rx="30" fill="#FFFFFF" stroke="#1D2B53" stroke-width="4"/>
    <rect x="244" y="292" width="10" height="24" fill="#FFFFFF"/>
    <text x="488" y="328" text-anchor="middle" class="b navy">
      <tspan font-size="26">Why?</tspan>
      <tspan font-size="29"> Why?</tspan>
      <tspan font-size="32"> Why?</tspan>
      <tspan font-size="35"> Why?</tspan>
      <tspan font-size="39" fill="#E8553A"> Why?</tspan>
    </text>
    <text x="488" y="370" font-size="23" fill="#44506E" text-anchor="middle">from goal time to the root need</text>
  </g>

